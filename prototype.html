<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Friends Job Help Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5f6b7a; --line: #e3e7ec;
    --accent: #0a66c2; --strong: #1f8a4c; --strong-bg: #e3f4ea; --good: #1d5fbf; --good-bg: #e4eefc;
    --stretch: #6b7280; --stretch-bg: #eef0f3; --warn: #a15c00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --card: #1a1f25; --text: #e8ebef; --muted: #9aa5b1; --line: #2b323a;
      --accent: #5aa9ff; --strong: #5fd394; --strong-bg: #1c3427; --good: #8bb8ff; --good-bg: #1d2a40;
      --stretch: #b3bac4; --stretch-bg: #262b31; --warn: #f0b35c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }
  header h1 { font-size: 26px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 22px 0; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .stat b { display: block; font-size: 24px; }
  .stat span { color: var(--muted); font-size: 13px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
  .controls input[type=search], .controls select {
    font: inherit; font-size: 14px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--text);
  }
  .controls input[type=search] { flex: 1 1 260px; }
  .chips { display: flex; gap: 6px; }
  .chip { font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); cursor: pointer; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .toggle { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .list { display: grid; gap: 12px; }
  .job { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px;
    display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; }
  .job.applied { opacity: .6; }
  .job h3 { margin: 0; font-size: 16px; }
  .job h3 a { color: var(--text); text-decoration: none; }
  .job h3 a:hover { color: var(--accent); text-decoration: underline; }
  .meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 4px; }
  .meta .sal { color: var(--text); font-weight: 600; }
  .badge { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; height: fit-content; }
  .badge.Strong { color: var(--strong); background: var(--strong-bg); }
  .badge.Good { color: var(--good); background: var(--good-bg); }
  .badge.Stretch { color: var(--stretch); background: var(--stretch-bg); }
  .notes { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px; }
  .notes div { line-height: 1.45; }
  .notes .lbl { font-weight: 600; display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
  .fit .lbl { color: var(--strong); }
  .gap .lbl { color: var(--warn); }
  .actions { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap;
    border-top: 1px solid var(--line); padding-top: 10px; }
  .btn { font: inherit; font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 8px; text-decoration: none;
    border: 1px solid var(--accent); color: #fff; background: var(--accent); cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--accent); }
  .empty { text-align: center; color: var(--muted); padding: 40px; }
  footer { margin-top: 28px; font-size: 12px; color: var(--muted); }
  @media (max-width: 640px) { .notes { grid-template-columns: 1fr; } .job { grid-template-columns: 1fr; } }

  .shell { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
  .side { background: var(--card); border-right: 1px solid var(--line); padding: 22px 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { font-weight: 700; font-size: 18px; }
  .side-sub { color: var(--muted); font-size: 13px; margin: 4px 0 18px; }
  .friends { display: grid; gap: 6px; margin-bottom: 14px; }
  .friend { display: flex; gap: 10px; align-items: center; text-align: left; font: inherit; color: var(--text);
    background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 8px; cursor: pointer; }
  .friend:hover { background: var(--bg); }
  .friend.on { background: var(--bg); border-color: var(--line); }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; flex: none; }
  .fmeta { display: flex; flex-direction: column; min-width: 0; }
  .fmeta b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fmeta small { color: var(--muted); font-size: 12px; }
  .btn.full { width: 100%; }
  .btn.small { padding: 5px 10px; font-size: 12px; }
  .btn.danger { background: #c62828; border-color: #c62828; }
  .top { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  .top h1 { font-size: 26px; margin: 0 0 4px; }
  .top p { margin: 0; color: var(--muted); font-size: 14px; }
  .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .skills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .skills span { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; z-index: 10; }
  .modal { background: var(--card); color: var(--text); border-radius: 14px; padding: 20px; width: min(560px, 100%); max-height: 90vh; overflow-y: auto; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .modal-head h2 { margin: 0; font-size: 18px; }
  .x { font-size: 22px; background: none; border: none; color: var(--muted); cursor: pointer; }
  .form { display: grid; gap: 12px; }
  .form label { display: grid; gap: 4px; font-size: 13px; font-weight: 500; }
  .form input, .form textarea, .form select { font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .linkbtn { background: none; border: none; color: #c62828; font: inherit; font-size: 12px; cursor: pointer; text-decoration: underline; }
  @media (max-width: 800px) { .shell { grid-template-columns: 1fr; } .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); } .row2 { grid-template-columns: 1fr; } }
</style>
</head>

const STORE_KEY = "friends-job-portal-v1";

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch {}
  return { friends: SEED_FRIENDS, activeId: "friend-1" };
}

function fmtDate(d) {
  if (!d) return "";
  return new Date(d + "T12:00:00").toLocaleDateString("en-CA", { month: "short", day: "numeric", year: "numeric" });
}

const uid = () => Math.random().toString(36).slice(2, 10);

function Modal({ title, onClose, children }) {

    <div className="overlay" onClick={onClose}>

        {children}
      </div>
    </div>
  );
}

function FriendForm({ initial, onSave, onCancel }) {
  const [f, setF] = useState(initial || { name: "", headline: "", location: "", skills: "" });

  return (
    <form className="form" onSubmit={e => { e.preventDefault(); if (f.name.trim()) onSave(f); }}>

        <button type="submit" className="btn">Save friend</button>

    </form>

}

      <div className="row2">

        <label>Match

function JobCard({ job, onToggle, onDelete }) {
  return (
    <article className={"job" + (job.applied ? " applied" : "")}>
      <div>
        <h3>{job.url ? <a href={job.url} target="_blank" rel="noopener noreferrer">{job.title}</a> : job.title}</h3>
        <div className="meta">
          <span><b>{job.company}</b></span>
          {job.location && <span>📍 {job.location}</span>}
          {job.posted && <span>🗓 {fmtDate(job.posted)}</span>}
          {job.salary && <span className="sal">💰 {job.salary}</span>}
        </div>
      </div>
      <span className={"badge " + job.match}>{job.match} match</span>
      {(job.fit || job.gaps) && (
        <div className="notes">
          <div className="fit"><span className="lbl">Why it fits</span>{job.fit || "—"}</div>
          <div className="gap"><span className="lbl">Gaps / watch-outs</span>{job.gaps || "—"}</div>
        </div>
      )}
      <div className="actions">
        <label className="toggle"><input type="checkbox" checked={!!job.applied} onChange={onToggle} /> Applied</label>
        <div style={{ display: "flex", gap: 8 }}>
          <button className="btn ghost small" onClick={onDelete}>Remove</button>
          {job.url && <a className="btn small" href={job.url} target="_blank" rel="noopener noreferrer">View posting ↗</a>}
        </div>
      </div>
    </article>
  );
}

function App() {
  const [state, setState] = useState(loadState);
  const [query, setQuery] = useState("");
  const [matches, setMatches] = useState({ Strong: true, Good: true, Stretch: true });
  const [sort, setSort] = useState("match");
  const [hideApplied, setHideApplied] = useState(false);
  const [modal, setModal] = useState(null); // "friend" | "edit" | "job" | "delete"

  useEffect(() => { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch {} }, [state]);

  const friend = state.friends.find(f => f.id === state.activeId) || state.friends[0];

  const updateFriend = (id, fn) => setState(s => ({ ...s, friends: s.friends.map(f => f.id === id ? fn(f) : f) }));

  const visible = useMemo(() => {
    if (!friend) return [];
    const q = query.trim().toLowerCase();

      .filter(j => matches[j.match])
      .filter(j => !hideApplied || !j.applied)
      .filter(j => !q || [j.title, j.company, j.location, j.fit, j.gaps].join(" ").toLowerCase().includes(q))
      .sort((a, b) => {
        if (sort === "newest") return (b.posted || "").localeCompare(a.posted || "");
        if (sort === "company") return a.company.localeCompare(b.company);
        return ORDER[a.match] - ORDER[b.match] || (b.posted || "").localeCompare(a.posted || "");
      });
  }, [friend, query, matches, sort, hideApplied]);

  const count = m => friend ? friend.jobs.filter(j => j.match === m).length : 0;
  const appliedCount = friend ? friend.jobs.filter(j => j.applied).length : 0;

  const linkedInSearch = friend
    ? `https://www.linkedin.com/jobs/search/?keywords=${encodeURIComponent((friend.headline || "").split("·")[0].trim())}&location=${encodeURIComponent(friend.location || "")}&f_TPR=r604800`
    : "#";

  return (
    <div className="shell">
      <aside className="side">
        <div className="brand">🤝 Friends Job Help</div>
        <p className="side-sub">Help your friends land their next role.</p>
        <div className="friends">
          {state.friends.map(f => (
            <button key={f.id} className={"friend" + (f.id === friend?.id ? " on" : "")}
              onClick={() => setState(s => ({ ...s, activeId: f.id }))}>
              <span className="avatar">{f.name.trim()[0]?.toUpperCase() || "?"}</span>
              <span className="fmeta"><b>{f.name}</b><small>{f.jobs.length} jobs · {f.jobs.filter(j => j.applied).length} applied</small></span>
            </button>
          ))}
        </div>
        <button className="btn full" onClick={() => setModal("friend")}>+ Add a friend</button>
      </aside>

      <main className="wrap">
        {!friend ? (
          <div className="empty">Add a friend to start tracking jobs for them.</div>
        ) : (
          <>
            <header className="top">
              <div>
                <h1>{friend.name}</h1>
                <p>{friend.headline || "No target role yet"}{friend.location ? ` · ${friend.location}` : ""}</p>
                {friend.skills && <div className="skills">{friend.skills.split(",").map(s => s.trim()).filter(Boolean).map(s => <span key={s}>{s}</span>)}</div>}
              </div>
              <div className="top-actions">
                <a className="btn ghost" href={linkedInSearch} target="_blank" rel="noopener noreferrer">Search LinkedIn ↗</a>
                <button className="btn ghost" onClick={() => setModal("edit")}>Edit profile</button>
                <button className="btn" onClick={() => setModal("job")}>+ Add job</button>
              </div>
            </header>

            <section className="stats">
              <div className="stat"><b>{friend.jobs.length}</b><span>Total matches</span></div>
              <div className="stat"><b style={{ color: "var(--strong)" }}>{count("Strong")}</b><span>Strong</span></div>
              <div className="stat"><b style={{ color: "var(--good)" }}>{count("Good")}</b><span>Good</span></div>
              <div className="stat"><b style={{ color: "var(--stretch)" }}>{count("Stretch")}</b><span>Stretch</span></div>
              <div className="stat"><b>{appliedCount}</b><span>Applied</span></div>
            </section>

            <section className="controls">
              <input type="search" placeholder="Search title, company, skill (e.g. Azure, Hybris)…" value={query} onChange={e => setQuery(e.target.value)} />
              <div className="chips">
                {["Strong", "Good", "Stretch"].map(m => (
                  <button key={m} className={"chip" + (matches[m] ? " on" : "")} onClick={() => setMatches(s => ({ ...s, [m]: !s[m] }))}>{m}</button>
                ))}
              </div>
              <select value={sort} onChange={e => setSort(e.target.value)}>
                <option value="match">Sort: best match</option>
                <option value="newest">Sort: newest</option>
                <option value="company">Sort: company A–Z</option>
              </select>
              <label className="toggle"><input type="checkbox" checked={hideApplied} onChange={e => setHideApplied(e.target.checked)} /> Hide applied</label>
            </section>

            <section className="list">
              {visible.length === 0
                ? <div className="empty">No jobs here yet. Use “+ Add job” or “Search LinkedIn”.</div>
                : visible.map(j => (
                    <JobCard key={j.id} job={j}
                      onToggle={() => updateFriend(friend.id, f => ({ ...f, jobs: f.jobs.map(x => x.id === j.id ? { ...x, applied: !x.applied } : x) }))}
                      onDelete={() => updateFriend(friend.id, f => ({ ...f, jobs: f.jobs.filter(x => x.id !== j.id) }))} />
                  ))}
            </section>

            <footer>
              Showing {visible.length} of {friend.jobs.length}. Data is saved in this browser only. Postings may close — check each link before applying.
              {" "}<button className="linkbtn" onClick={() => setModal("delete")}>Remove this friend</button>
            </footer>
          </>
        )}
      </main>

      {modal === "friend" && (
        <Modal title="Add a friend" onClose={() => setModal(null)}>
          <FriendForm onCancel={() => setModal(null)} onSave={f => {
            const id = "friend-" + uid();
            setState(s => ({ friends: [...s.friends, { ...f, id, jobs: [] }], activeId: id }));
            setModal(null);
          }} />
        </Modal>
      )}
      {modal === "edit" && friend && (
        <Modal title="Edit profile" onClose={() => setModal(null)}>
          <FriendForm initial={friend} onCancel={() => setModal(null)} onSave={f => { updateFriend(friend.id, old => ({ ...old, ...f })); setModal(null); }} />
        </Modal>
      )}
      {modal === "job" && friend && (
        <Modal title={`Add a job for ${friend.name}`} onClose={() => setModal(null)}>
          <JobForm onCancel={() => setModal(null)} onSave={j => { updateFriend(friend.id, f => ({ ...f, jobs: [...f.jobs, { ...j, id: uid(), applied: false }] })); setModal(null); }} />
        </Modal>
      )}
      {modal === "delete" && friend && (
        <Modal title={`Remove ${friend.name}?`} onClose={() => setModal(null)}>
          <p>This deletes their profile and all {friend.jobs.length} saved jobs from this browser.</p>
          <div className="form-actions">
            <button className="btn ghost" onClick={() => setModal(null)}>Cancel</button>
            <button className="btn danger" onClick={() => {
              setState(s => { const friends = s.friends.filter(f => f.id !== friend.id); return { friends, activeId: friends[0]?.id }; });
              setModal(null);
            }}>Remove</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
